<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>extensions — absent</title>
<link rel="icon" type="image/svg+xml" href="/public/absent-favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root {
  --bg-body: #050505; --text-primary: #ebebeb; --text-muted: #8c8c8c; --text-faint: #737373;
  --bg-surface-0: #060606; --bg-surface-2: #0e0e0e; --bg-surface-4: #141414;
  --border-subtle: #ffffff0d; --border-faint: #ffffff1c;
  --absent-accent: #edf2f7; --absent-accent-dim: #66737e;
  --danger: #8b0000; --ok: #4ea86b;
  --radius-item: 10px; --radius-tooltip: 8px;
  --font: 'Lexend', sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { background: var(--bg-body); color: var(--text-primary); font-family: var(--font); text-transform: lowercase; min-height: 100vh; padding: 32px 24px; }
body::before {
  content: ""; position: fixed; inset: 0;
  background-image:
    radial-gradient(circle at 50% 50%, #05050580 0, var(--bg-body) 80%),
    linear-gradient(#1b1b1b 1px, transparent 0),
    linear-gradient(90deg, #1b1b1b 1px, transparent 0);
  background-size: 100% 100%, 20px 20px, 20px 20px;
  pointer-events: none; z-index: 0;
}
body > * { position: relative; z-index: 1; }
.shell { max-width: 900px; margin: 0 auto; }
.head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; flex-wrap: wrap; gap: 16px; }
.head-left { display: flex; align-items: center; gap: 12px; color: var(--absent-accent); }
.head-left svg { width: 22px; height: 22px; }
.head-left .wordmark { font-size: 13px; font-weight: 700; letter-spacing: .24em; }
.head-title { font-size: 11px; letter-spacing: .22em; color: var(--absent-accent-dim); }
.install-btn { background: var(--absent-accent); border: none; border-radius: var(--radius-tooltip); color: #000; padding: 10px 20px; font-family: var(--font); font-size: 11px; font-weight: 600; letter-spacing: .18em; cursor: pointer; transition: background .14s; text-transform: lowercase; }
.install-btn:hover { background: #fff; }

.notice { background: var(--bg-surface-0); border: 1px solid var(--border-subtle); border-left: 2px solid var(--absent-accent-dim); border-radius: var(--radius-tooltip); padding: 14px 18px; margin-bottom: 24px; font-size: 11px; line-height: 1.7; color: var(--text-muted); letter-spacing: .04em; }
.notice b { color: var(--absent-accent); font-weight: 600; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
.ext { background: var(--bg-surface-0); border: 1px solid var(--border-subtle); border-radius: var(--radius-item); padding: 18px; display: flex; flex-direction: column; gap: 12px; transition: border-color .14s, transform .14s; }
.ext:hover { border-color: var(--absent-accent); transform: translateY(-2px); }
.ext-head { display: flex; align-items: center; gap: 12px; }
.ext-icon { width: 38px; height: 38px; border-radius: 8px; background: var(--bg-surface-4); display: grid; place-items: center; color: var(--absent-accent); font-size: 15px; flex-shrink: 0; }
.ext-meta { overflow: hidden; }
.ext-name { font-size: 12px; font-weight: 600; color: var(--absent-accent); margin-bottom: 2px; }
.ext-author { font-size: 10px; letter-spacing: .14em; color: var(--text-faint); }
.ext-desc { font-size: 11px; line-height: 1.7; color: var(--text-muted); }
.ext-foot { display: flex; justify-content: space-between; align-items: center; margin-top: auto; padding-top: 12px; border-top: 1px solid var(--border-subtle); }
.ext-status { font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: var(--text-faint); }
.ext-status[data-state="enabled"] { color: var(--ok); }
.ext-actions { display: flex; gap: 6px; }
.ext-toggle { background: none; border: 1px solid var(--border-faint); border-radius: 6px; color: var(--absent-accent-dim); padding: 5px 12px; font-family: var(--font); font-size: 10px; letter-spacing: .14em; cursor: pointer; text-transform: lowercase; transition: all .14s; }
.ext-toggle:hover { border-color: var(--absent-accent); color: var(--absent-accent); }
.ext-toggle[data-on="true"] { background: var(--absent-accent); border-color: var(--absent-accent); color: #000; }
.ext-remove { background: none; border: 1px solid var(--border-faint); border-radius: 6px; color: var(--absent-accent-dim); padding: 5px 10px; font-family: var(--font); font-size: 10px; cursor: pointer; transition: all .14s; }
.ext-remove:hover { border-color: var(--danger); color: var(--danger); }
.empty-state { grid-column: 1 / -1; text-align: center; padding: 48px 24px; background: var(--bg-surface-0); border: 1px dashed var(--border-faint); border-radius: var(--radius-item); }
.empty-state .icon { color: var(--absent-accent-dim); font-size: 32px; margin-bottom: 12px; opacity: .6; }
.empty-state p { font-size: 11px; letter-spacing: .18em; color: var(--text-faint); }
.back { display: inline-block; margin-top: 24px; font-size: 11px; letter-spacing: .14em; color: var(--absent-accent-dim); text-decoration: none; border: 1px solid var(--border-faint); border-radius: var(--radius-tooltip); padding: 8px 14px; transition: all .14s; }
.back:hover { background: var(--bg-surface-4); border-color: var(--absent-accent); color: var(--absent-accent); }
input[type="file"] { display: none; }
</style>
</head>
<body>
<div class="shell">
  <div class="head">
    <div class="head-left">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <circle cx="12" cy="12" r="2.5"/>
        <ellipse cx="12" cy="12" rx="10" ry="4.5"/>
        <ellipse cx="12" cy="12" rx="10" ry="4.5" transform="rotate(60 12 12)"/>
        <ellipse cx="12" cy="12" rx="10" ry="4.5" transform="rotate(120 12 12)"/>
      </svg>
      <span class="wordmark">absent</span>
    </div>
    <div class="head-title">extensions</div>
    <button class="install-btn" onclick="document.getElementById('ext-file').click()">install .crx / .zip</button>
    <input type="file" id="ext-file" accept=".crx,.zip">
  </div>

  <div class="notice"><b>note</b> — extensions are executed in the proxy sandbox. chromium extensions that rely on native messaging, devtools panels, or OS-level APIs will not function. use with trusted sources only.</div>

  <div class="grid" id="ext-grid"></div>
  <a class="back" href="/">return home</a>
</div>

<script>
const STORAGE_KEY = 'absent.extensions';
function loadExtensions() { try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); } catch { return []; } }
function saveExtensions(list) { localStorage.setItem(STORAGE_KEY, JSON.stringify(list)); }

function render() {
  const list = loadExtensions();
  const grid = document.getElementById('ext-grid');
  if (!list.length) {
    grid.innerHTML = `<div class="empty-state"><div class="icon">✧</div><p>no extensions installed</p></div>`;
    return;
  }
  grid.innerHTML = list.map((ext, i) => `
    <div class="ext">
      <div class="ext-head">
        <div class="ext-icon"><i class="${ext.icon || 'fa-solid fa-puzzle-piece'}"></i></div>
        <div class="ext-meta"><div class="ext-name">${ext.name}</div><div class="ext-author">${ext.author || 'unknown'}</div></div>
      </div>
      <div class="ext-desc">${ext.description || 'no description provided.'}</div>
      <div class="ext-foot">
        <div class="ext-status" data-state="${ext.enabled ? 'enabled' : 'disabled'}">${ext.enabled ? 'enabled' : 'disabled'}</div>
        <div class="ext-actions">
          <button class="ext-toggle" data-on="${ext.enabled}" onclick="toggleExt(${i})">${ext.enabled ? 'disable' : 'enable'}</button>
          <button class="ext-remove" onclick="removeExt(${i})" aria-label="remove"><i class="fa-solid fa-xmark"></i></button>
        </div>
      </div>
    </div>
  `).join('');
}
function toggleExt(i) { const list = loadExtensions(); if (!list[i]) return; list[i].enabled = !list[i].enabled; saveExtensions(list); render(); notifyWorker(list); }
function removeExt(i) { const list = loadExtensions(); if (!list[i]) return; if (!confirm(`remove ${list[i].name}?`)) return; list.splice(i, 1); saveExtensions(list); render(); notifyWorker(list); }
function notifyWorker(list) {
  if (navigator.serviceWorker && navigator.serviceWorker.controller) {
    navigator.serviceWorker.controller.postMessage({ type: 'extensions.update', extensions: list.filter(e => e.enabled) });
  }
}
document.getElementById('ext-file').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const ext = {
    name: file.name.replace(/\.(crx|zip)$/i, ''),
    author: 'local',
    description: `installed from ${file.name} (${(file.size / 1024).toFixed(1)} kb)`,
    icon: 'fa-solid fa-puzzle-piece',
    enabled: false,
    installedAt: new Date().toISOString(),
    size: file.size
  };
  const list = loadExtensions();
  list.push(ext);
  saveExtensions(list);
  render();
  e.target.value = '';
});
render();
</script>
</body>
</html>
