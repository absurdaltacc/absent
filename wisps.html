<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Absent — Wisp Servers</title>
  <link rel="icon" type="image/svg+xml" href="/public/absent-favicon.svg">
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-body: #050505;
      --bg-surface-0: #060606;
      --bg-surface-2: #0e0e0e;
      --bg-surface-4: #141414;
      --text-primary: #ebebeb;
      --text-muted: #8c8c8c;
      --text-faint: #737373;
      --absent-accent: #edf2f7;
      --absent-accent-dim: #66737e;
      --border-subtle: #ffffff0d;
      --border-faint: #ffffff1c;
      --radius-item: 10px;
      --radius-frame: 6px;
      --font: 'Lexend', sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg-body);
      color: var(--text-primary);
      font-family: var(--font);
      text-transform: lowercase;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }
    .wisp-shell {
      width: 100%;
      max-width: 520px;
      background: var(--bg-surface-0);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-item);
      padding: 28px 24px;
    }
    .wisp-mark {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--absent-accent);
      margin-bottom: 4px;
    }
    .wisp-mark svg { width: 22px; height: 22px; }
    .wisp-mark .wordmark {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .24em;
    }
    .wisp-sub {
      color: var(--absent-accent-dim);
      font-size: 10px;
      letter-spacing: .18em;
      margin-bottom: 24px;
    }
    .wisp-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .wisp-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg-surface-2);
      border: 1px solid var(--border-faint);
      border-radius: var(--radius-frame);
      padding: 12px 16px;
      cursor: pointer;
      transition: background 140ms, border-color 140ms;
    }
    .wisp-item:hover {
      background: var(--bg-surface-4);
      border-color: var(--absent-accent);
    }
    .wisp-name {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-primary);
    }
    .wisp-url {
      font-size: 10px;
      color: var(--text-faint);
      font-family: ui-monospace, Menlo, monospace;
      text-transform: none;
    }
    .wisp-latency {
      font-size: 10px;
      color: var(--absent-accent-dim);
      letter-spacing: .08em;
    }
    .wisp-latency[data-state="good"] { color: #55ff55; }
    .wisp-latency[data-state="mid"]  { color: #d4a13a; }
    .wisp-latency[data-state="bad"]  { color: #b00000; }
  </style>
</head>
<body>
  <div class="wisp-shell">
    <div class="wisp-mark">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <circle cx="12" cy="12" r="2.5"/>
        <ellipse cx="12" cy="12" rx="10" ry="4.5"/>
        <ellipse cx="12" cy="12" rx="10" ry="4.5" transform="rotate(60 12 12)"/>
        <ellipse cx="12" cy="12" rx="10" ry="4.5" transform="rotate(120 12 12)"/>
      </svg>
      <span class="wordmark">absent</span>
    </div>
    <div class="wisp-sub">select a wisp server</div>
    <div class="wisp-list" id="wisp-list"></div>
  </div>

  <script>
    const WISP_SERVERS = [
      { name: "Wisp 1", url: "wss://glseries.net/wisp/" },
      { name: "Wisp 2", url: "wss://wispserver.dev/wisp/" },
      { name: "Wisp 3", url: "wss://seminar.drama.english.assignment.literature.homebrewer.org/wisp/" },
      { name: "Wisp 4", url: "wss://admin.proxy.hydrovolter.com/scramjet/wisp/" },
      { name: "Wisp 5", url: "wss://scram.owoellen.rocks/wisp/" },
    ];

    async function pingServer(url) {
      return new Promise(resolve => {
        const start = Date.now();
        try {
          const ws = new WebSocket(url);
          const t = setTimeout(() => { try { ws.close(); } catch {} resolve({ url, success: false, latency: null }); }, 3000);
          ws.onopen = () => { clearTimeout(t); try { ws.close(); } catch {} resolve({ url, success: true, latency: Date.now() - start }); };
          ws.onerror = () => { clearTimeout(t); resolve({ url, success: false, latency: null }); };
        } catch { resolve({ url, success: false, latency: null }); }
      });
    }

    function renderServers() {
      const list = document.getElementById('wisp-list');
      list.innerHTML = '';
      for (const s of WISP_SERVERS) {
        const item = document.createElement('div');
        item.className = 'wisp-item';
        item.innerHTML = `
          <div>
            <div class="wisp-name">${s.name}</div>
            <div class="wisp-url">${s.url}</div>
          </div>
          <div class="wisp-latency" data-state="loading">pinging…</div>
        `;
        item.addEventListener('click', () => {
          localStorage.setItem('absent.wisp', s.url);
          localStorage.setItem('absent.wispName', s.name);
          item.style.borderColor = 'var(--absent-accent)';
          setTimeout(() => item.style.borderColor = '', 400);
        });
        list.appendChild(item);

        pingServer(s.url).then(r => {
          const latencyEl = item.querySelector('.wisp-latency');
          if (r.success) {
            latencyEl.textContent = r.latency + 'ms';
            latencyEl.dataset.state = r.latency < 150 ? 'good' : r.latency < 400 ? 'mid' : 'bad';
          } else {
            latencyEl.textContent = 'offline';
            latencyEl.dataset.state = 'bad';
          }
        });
      }
    }

    renderServers();
  </script>
</body>
</html>
