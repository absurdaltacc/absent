<style>
:root {
  --bg-body: #050505;
  --bg-body-grid: #1b1b1b;
  --text-primary: #ebebeb;
  --text-secondary: #cccccc;
  --text-muted: #8c8c8c;
  --text-dimmed: #a6a6d6;
  --text-faint: #737373;
  --bg-surface-0: #060606;
  --bg-surface-1: #0b0b0b;
  --bg-surface-2: #0e0e0e;
  --bg-surface-3: #111111;
  --bg-surface-4: #141414;
  --bg-surface-hover: #2f2f2f;
  --border-subtle: #ffffff0d;
  --border-faint: #ffffff1c;
  --border-medium: #2b2b2b;
  --absent-accent: #edf2f7;
  --absent-accent-dim: #66737e;
  --radius-item: 10px;
  --radius-tooltip: 8px;
  --radius-bar: 25px;
  --font: 'Lexend', sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body { background-color: var(--bg-body); color: var(--text-primary); font-family: var(--font); text-transform: lowercase; display: flex; }
body::before {
  content: ""; position: fixed; inset: 0;
  background-image:
    radial-gradient(circle at 50% 50%, #05050580 0, var(--bg-body) 80%),
    linear-gradient(var(--bg-body-grid) 1px, transparent 0),
    linear-gradient(90deg, var(--bg-body-grid) 1px, transparent 0);
  background-size: 100% 100%, 20px 20px, 20px 20px;
  pointer-events: none; z-index: 0;
}
body > * { position: relative; z-index: 1; }
::selection { background: var(--absent-accent); color: #000; }
::-webkit-scrollbar { width: 3px; }
::-webkit-scrollbar-thumb { background: var(--border-medium); border-radius: 999px; }

.sidebar { width: 220px; flex-shrink: 0; background: var(--bg-surface-0); border-right: 1px solid var(--border-subtle); display: flex; flex-direction: column; padding: 10px; transition: margin-left .14s cubic-bezier(.4,0,.2,1), opacity .14s; white-space: nowrap; }
.sidebar.hidden { margin-left: -220px; opacity: 0; }
.sidebar-mark { display: flex; align-items: center; gap: 10px; padding: 14px 10px 24px; color: var(--absent-accent); }
.sidebar-mark svg { width: 22px; height: 22px; }
.sidebar-mark .wordmark { font-size: 13px; font-weight: 700; letter-spacing: .24em; }
.nav-item { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: var(--radius-item); color: var(--text-muted); font-size: 12px; font-weight: 500; letter-spacing: .04em; cursor: pointer; transition: background .14s, color .14s; border: none; background: none; width: 100%; text-align: left; font-family: var(--font); text-transform: lowercase; }
.nav-item i { width: 16px; font-size: 12px; text-align: center; }
.nav-item:hover, .nav-item.active { background: var(--bg-surface-2); color: var(--absent-accent); }
.nav-item.active { background: var(--bg-surface-3); }
.sidebar-bottom { margin-top: auto; padding-top: 12px; border-top: 1px solid var(--border-subtle); }
.sidebar-bottom .nav-item { font-size: 11px; }

.main { flex: 1; display: flex; flex-direction: column; min-width: 0; height: 100%; }
.topbar { height: 76px; flex-shrink: 0; display: flex; align-items: center; gap: 12px; padding: 0 20px; border-bottom: 1px solid var(--border-subtle); background: color-mix(in srgb, var(--bg-body) 80%, transparent); backdrop-filter: blur(12px); }
.hamburger { display: none; width: 38px; height: 30px; border: 1px solid var(--border-faint); border-radius: 7px; background: var(--bg-surface-2); cursor: pointer; flex-direction: column; align-items: center; justify-content: center; gap: 3px; }
.hamburger span { display: block; width: 14px; height: 1px; background: var(--text-dimmed); }
.url-bar { flex: 1; display: flex; align-items: center; gap: 8px; background: var(--bg-surface-2); border: 1px solid var(--border-faint); border-radius: var(--radius-bar); padding: 0 6px 0 16px; height: 40px; transition: border-color .14s; }
.url-bar:focus-within { border-color: var(--absent-accent); }
.url-bar input { flex: 1; background: none; border: none; outline: none; color: var(--text-primary); font-family: var(--font); font-size: 13px; text-transform: lowercase; height: 100%; }
.url-bar input::placeholder { color: var(--text-faint); }
.icon-btn { width: 32px; height: 32px; border-radius: 50%; border: none; background: var(--bg-surface-3); color: var(--text-muted); cursor: pointer; display: grid; place-items: center; font-size: 12px; transition: background .14s, color .14s; }
.icon-btn:hover { background: var(--bg-surface-hover); color: var(--absent-accent); }
.icon-btn.primary { background: var(--absent-accent); color: #000; }
.icon-btn.primary:hover { background: #fff; }

.content { flex: 1; overflow-y: auto; position: relative; }
.view { display: none; height: 100%; }
.view.active { display: flex; flex-direction: column; }

.home { align-items: center; display: flex; flex-direction: column; margin: 0 auto; max-width: 760px; padding: 10vh 20px 40px; width: 100%; text-align: center; }
.home-mark { color: var(--absent-accent); margin-bottom: 16px; }
.home-mark svg { width: 48px; height: 48px; }
.home-wordmark { color: var(--absent-accent); font-size: 15px; font-weight: 700; letter-spacing: .24em; margin-bottom: 30px; }
.home-wordmark span { color: var(--absent-accent-dim); font-size: 9px; font-weight: 400; letter-spacing: .16em; margin-left: 8px; }
.home-search { max-width: 520px; width: 100%; margin: 0 0 8px; }
.home-search input { width: 100%; background: var(--bg-surface-2); border: 1px solid var(--border-faint); border-radius: var(--radius-tooltip); padding: 15px 18px; color: var(--text-primary); font-family: var(--font); font-size: 13px; outline: none; text-transform: lowercase; transition: border-color .14s; }
.home-search input:focus { border-color: var(--absent-accent); }
.home-search input::placeholder { color: var(--text-faint); }
.home-hint { color: var(--absent-accent-dim); font-size: 10px; margin-bottom: 28px; }
.apps { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 12px; max-width: 520px; }
.app { align-items: center; background: var(--bg-surface-2); border: 1px solid var(--border-faint); border-radius: var(--radius-tooltip); color: var(--text-dimmed); cursor: pointer; display: flex; font: inherit; font-size: 11px; gap: 9px; padding: 9px 12px; transition: background .16s, border-color .16s, color .16s, transform .16s; text-transform: lowercase; }
.app:hover { background: var(--bg-surface-4); border-color: var(--absent-accent); color: var(--absent-accent); transform: translateY(-2px); }
.app-icon { align-items: center; background: var(--bg-surface-4); border-radius: 5px; color: var(--absent-accent); display: inline-flex; font-size: 11px; height: 22px; justify-content: center; width: 22px; }

.browser-frame-wrap { flex: 1; position: relative; background: var(--bg-body); }
.browser-frame-wrap iframe { width: 100%; height: 100%; border: none; display: block; background: #fff; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 14px; padding: 24px 28px 60px; }
.tile { background: var(--bg-surface-2); border: 1px solid var(--border-subtle); border-radius: var(--radius-item); padding: 14px; cursor: pointer; transition: background .16s, border-color .16s, transform .16s; text-align: left; color: var(--text-primary); font-family: var(--font); text-transform: lowercase; }
.tile:hover { background: var(--bg-surface-4); border-color: var(--absent-accent); transform: translateY(-2px); }
.tile .tile-name { font-size: 12px; font-weight: 600; margin-bottom: 4px; }
.tile .tile-desc { font-size: 10px; color: var(--text-faint); }

.settings-panel { position: fixed; top: 0; right: 0; width: 380px; max-width: 92vw; height: 100%; background: var(--bg-surface-1); border-left: 1px solid var(--border-faint); padding: 28px 24px; overflow-y: auto; transform: translateX(100%); transition: transform .22s cubic-bezier(.4,0,.2,1); z-index: 50; }
.settings-panel.open { transform: translateX(0); }
.settings-panel h2 { font-size: 12px; font-weight: 600; letter-spacing: .24em; color: var(--absent-accent); text-transform: uppercase; margin-bottom: 24px; }
.settings-label { display: block; font-size: 10px; letter-spacing: .18em; color: var(--text-faint); text-transform: uppercase; margin: 18px 0 8px; }
.settings-panel select, .settings-panel input { width: 100%; background: var(--bg-surface-3); border: 1px solid var(--border-faint); border-radius: 6px; padding: 10px 12px; color: var(--text-primary); font-family: var(--font); font-size: 12px; outline: none; text-transform: lowercase; }
.settings-panel select:focus, .settings-panel input:focus { border-color: var(--absent-accent); }
.settings-close { position: absolute; top: 20px; right: 20px; background: none; border: none; color: var(--text-muted); font-size: 16px; cursor: pointer; }
.settings-close:hover { color: var(--absent-accent); }

.backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.6); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 40; }
.backdrop.open { opacity: 1; pointer-events: auto; }

.toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--bg-surface-3); border: 1px solid var(--border-faint); border-radius: 999px; color: var(--absent-accent); padding: 10px 20px; font-size: 11px; letter-spacing: .1em; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 60; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

.boot-overlay { position: fixed; inset: 0; background: var(--bg-body); z-index: 200; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; transition: opacity .4s, visibility .4s; }
.boot-overlay.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
.boot-overlay .mark { color: var(--absent-accent); }
.boot-overlay .mark svg { width: 42px; height: 42px; animation: spin 3s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.boot-overlay .label { font-size: 11px; letter-spacing: .32em; color: var(--absent-accent-dim); text-transform: uppercase; }
.boot-overlay .status { font-size: 10px; letter-spacing: .2em; color: var(--text-faint); }

@media (max-width: 720px) {

  .hamburger { display: flex; }
  .grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); padding: 16px 16px 60px; }
}
</style>

<script>
const state = {
  wisp: localStorage.getItem('absent.wisp') || 'wss://wisp.mercurywork.shop/',
  wispName: localStorage.getItem('absent.wispName') || 'wss://wisp.mercurywork.shop/',
  currentView: 'home',
  ready: false
};

const $ = (s) => document.querySelector(s);
let scramjet = null;
let scramjetFrame = null;

function setBootStatus(msg) {
  const el = $('#boot-status');
  if (el) el.textContent = msg;
}
function hideBoot() {
  const el = $('#boot-overlay');
  if (el) el.classList.add('hidden');
}

async function bootScramjet() {
  setBootStatus('loading scramjet…');
  if (!window.$scramjetLoadController) {
    setBootStatus('scramjet failed to load');
    console.error('[absent] scramjet.all.js missing');
    return;
  }

  setBootStatus('setting up transport…');
  try {
    const connection = new window.BareMux.BareMuxConnection('/baremux/worker.js');
    await connection.setTransport('/epoxy/index.mjs', [{ wisp: state.wisp }]);
    console.log('[absent] transport set:', state.wisp);
  } catch (e) {
    console.warn('[absent] transport setup failed', e);
    setBootStatus('transport failed — check console');
  }

  setBootStatus('registering service worker…');
  if ('serviceWorker' in navigator) {
    try {
      await navigator.serviceWorker.register('/bareworker.js', { scope: '/' });
      await navigator.serviceWorker.ready;
    } catch (e) {
      console.warn('[absent] sw registration failed', e);
    }
  }

  setBootStatus('initializing scramjet…');
  try {
    const { ScramjetController } = $scramjetLoadController();
    scramjet = new ScramjetController({
      files: {
        wasm: 'https://cdn.jsdelivr.net/gh/Destroyed12121/Staticsj@main/JS/scramjet.wasm.wasm',
        all:  'https://cdn.jsdelivr.net/gh/Destroyed12121/Staticsj@main/JS/scramjet.all.js',
        sync: 'https://cdn.jsdelivr.net/gh/Destroyed12121/Staticsj@main/JS/scramjet.sync.js'
      },
      prefix: '/scramjet/'
    });
    await scramjet.init();
    console.log('[absent] scramjet controller ready');
  } catch (e) {
    console.error('[absent] scramjet init failed', e);
    setBootStatus('scramjet init failed');
    return;
  }

  state.ready = true;
  setBootStatus('ready');
  setTimeout(hideBoot, 400);
  window.dispatchEvent(new Event('scramjet-ready'));
  restoreFromHash();
}

function ensureFrame() {
  if (scramjetFrame) return scramjetFrame;
  if (!scramjet) return null;
  const wrap = $('#browser-frame-wrap');
  wrap.innerHTML = '';
  scramjetFrame = scramjet.createFrame();
  scramjetFrame.frame.id = 'browser-frame';
  scramjetFrame.frame.style.cssText = 'width:100%;height:100%;border:0;background:#fff;display:block;';
  wrap.appendChild(scramjetFrame.frame);
  return scramjetFrame;
}

function normalizeUrl(input) {
  if (!input) return null;
  let url = input.trim();
  if (!/^https?:\/\//i.test(url)) {
    if (url.includes('.') && !url.includes(' ')) url = 'https://' + url;
    else url = 'https://duckduckgo.com/?q=' + encodeURIComponent(url);
  }
  return url;
}

function navigate(input) {
  const url = normalizeUrl(input);
  if (!url) return;
  setView('browser');
  if (!state.ready) {
    showToast('booting — try again');
    window.addEventListener('scramjet-ready', () => navigate(url), { once: true });
    return;
  }
  const frame = ensureFrame();
  if (!frame) { showToast('scramjet unavailable'); return; }
  frame.go(url);
  $('#url-input').value = url;
  history.replaceState(null, '', '#browse=' + encodeURIComponent(url));
}

function setView(name) {
  state.currentView = name;
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('active', v.id === 'view-' + name));
  document.querySelectorAll('.nav-item[data-view]').forEach(b => b.classList.toggle('active', b.dataset.view === name));
  if (window.innerWidth <= 720) $('#sidebar').classList.add('hidden');
}

document.querySelectorAll('.nav-item[data-view]').forEach(btn => {
  btn.addEventListener('click', () => setView(btn.dataset.view));
});
document.querySelectorAll('.app').forEach(btn => {
  if (btn.dataset.app) btn.addEventListener('click', () => setView(btn.dataset.app));
});
document.querySelectorAll('.tile').forEach(tile => {
  tile.addEventListener('click', () => navigate(tile.dataset.url));
});

$('#hamburger').addEventListener('click', () => $('#sidebar').classList.toggle('hidden'));
$('#go-btn').addEventListener('click', () => navigate($('#url-input').value));
$('#url-input').addEventListener('keydown', e => { if (e.key === 'Enter') navigate($('#url-input').value); });
$('#home-search-input').addEventListener('keydown', e => { if (e.key === 'Enter') navigate($('#home-search-input').value); });
$('#home-btn').addEventListener('click', () => setView('home'));
$('#reload-btn').addEventListener('click', () => {
  if (scramjetFrame && $('#url-input').value) scramjetFrame.go($('#url-input').value);
});

function openSettings() {
  $('#settings').classList.add('open');
  $('#backdrop').classList.add('open');
  $('#wisp-select').value = state.wispName;
  $('#wisp-custom').value = state.wisp;
  $('#wisp-custom').disabled = state.wispName !== 'custom';
}
function closeSettings() {
  $('#settings').classList.remove('open');
  $('#backdrop').classList.remove('open');
}
$('#open-settings').addEventListener('click', openSettings);
$('#settings-close').addEventListener('click', closeSettings);
$('#backdrop').addEventListener('click', closeSettings);
$('#wisp-select').addEventListener('change', e => {
  $('#wisp-custom').disabled = e.target.value !== 'custom';
});
$('#apply-wisp').addEventListener('click', () => {
  const sel = $('#wisp-select').value;
  const custom = $('#wisp-custom').value.trim();
  const url = sel === 'custom' ? custom : sel;
  if (!url) { showToast('enter a wisp url'); return; }
  localStorage.setItem('absent.wisp', url);
  localStorage.setItem('absent.wispName', sel);
  showToast('saved — reloading');
  setTimeout(() => location.reload(), 600);
});

function restoreFromHash() {
  const m = location.hash.match(/^#browse=(.+)$/);
  if (!m) return;
  const url = decodeURIComponent(m[1]);
  $('#url-input').value = url;
  setView('browser');
  if (state.ready) {
    const frame = ensureFrame();
    if (frame) frame.go(url);
  } else {
    window.addEventListener('scramjet-ready', () => {
      const frame = ensureFrame();
      if (frame) frame.go(url);
    }, { once: true });
  }
}
window.addEventListener('hashchange', restoreFromHash);

window.addEventListener('message', e => {
  if (e.data?.type === 'absent.navigate' && typeof e.data.url === 'string') {
    navigate(e.data.url);
  }
});

let toastTimer;
function showToast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2400);
}

window.addEventListener('load', () => {
  bootScramjet();
});
</script>
</body>
</html>
