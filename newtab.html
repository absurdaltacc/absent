<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>new tab — absent</title>
<link rel="icon" type="image/svg+xml" href="/public/absent-favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg-body: #050505;
  --text-primary: #ebebeb;
  --text-muted: #8c8c8c;
  --text-faint: #737373;
  --text-dimmed: #a6a6d6;
  --bg-surface-0: #060606;
  --bg-surface-2: #0e0e0e;
  --bg-surface-3: #111111;
  --bg-surface-4: #141414;
  --bg-surface-hover: #2f2f2f;
  --border-subtle: #ffffff0d;
  --border-faint: #ffffff1c;
  --absent-accent: #edf2f7;
  --absent-accent-dim: #66737e;
  --radius-item: 10px;
  --radius-tooltip: 8px;
  --radius-bar: 25px;
  --font: 'Lexend', sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: var(--bg-body);
  color: var(--text-primary);
  font-family: var(--font);
  text-transform: lowercase;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  padding: 24px;
}
body::before {
  content: "";
  position: fixed;
  inset: 0;
  background-image:
    radial-gradient(circle at 50% 50%, #05050580 0, var(--bg-body) 80%),
    linear-gradient(#1b1b1b 1px, transparent 0),
    linear-gradient(90deg, #1b1b1b 1px, transparent 0);
  background-size: 100% 100%, 20px 20px, 20px 20px;
  pointer-events: none;
  z-index: 0;
}
body > * { position: relative; z-index: 1; }
.newtab {
  width: 100%;
  max-width: 640px;
  text-align: center;
}
.mark {
  color: var(--absent-accent);
  margin-bottom: 12px;
}
.mark svg { width: 42px; height: 42px; }
.wordmark {
  font-size: 13px;
  font-weight: 700;
  letter-spacing: .24em;
  color: var(--absent-accent);
  margin-bottom: 4px;
}
.clock {
  font-size: 11px;
  letter-spacing: .22em;
  color: var(--absent-accent-dim);
  margin-bottom: 32px;
}
.clock b { color: var(--absent-accent); font-weight: 500; }
.search-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--bg-surface-2);
  border: 1px solid var(--border-faint);
  border-radius: var(--radius-bar);
  padding: 0 6px 0 20px;
  height: 48px;
  margin-bottom: 28px;
  transition: border-color 140ms;
}
.search-bar:focus-within { border-color: var(--absent-accent); }
.search-bar input {
  flex: 1;
  background: none;
  border: none;
  outline: none;
  color: var(--text-primary);
  font-family: var(--font);
  font-size: 13px;
  text-transform: lowercase;
  height: 100%;
}
.search-bar input::placeholder { color: var(--text-faint); }
.search-btn {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  border: none;
  background: var(--absent-accent);
  color: #000;
  cursor: pointer;
  display: grid;
  place-items: center;
  font-size: 13px;
  transition: background 140ms;
}
.search-btn:hover { background: #fff; }

.shortcuts {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  margin-bottom: 28px;
}
.shortcut {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  padding: 14px 8px;
  background: var(--bg-surface-2);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-item);
  cursor: pointer;
  transition: background 140ms, border-color 140ms, transform 140ms;
  text-decoration: none;
  color: var(--text-primary);
}
.shortcut:hover {
  background: var(--bg-surface-4);
  border-color: var(--absent-accent);
  transform: translateY(-2px);
}
.shortcut-icon {
  width: 30px;
  height: 30px;
  border-radius: 8px;
  background: var(--bg-surface-4);
  display: grid;
  place-items: center;
  color: var(--absent-accent);
  font-size: 13px;
}
.shortcut-name {
  font-size: 10px;
  letter-spacing: .14em;
  color: var(--absent-accent-dim);
}

.recent {
  text-align: left;
  padding: 20px;
  background: var(--bg-surface-0);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-item);
}
.recent-title {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: .24em;
  color: var(--absent-accent-dim);
  text-transform: uppercase;
  margin-bottom: 12px;
}
.recent-list {
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.recent-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 6px 10px;
  border-radius: 6px;
  cursor: pointer;
  transition: background 140ms;
  text-decoration: none;
  color: var(--text-muted);
  font-size: 12px;
}
.recent-item:hover {
  background: var(--bg-surface-2);
  color: var(--absent-accent);
}
.recent-dot {
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: var(--absent-accent-dim);
  flex-shrink: 0;
}
.recent-empty {
  font-size: 11px;
  color: var(--text-faint);
  letter-spacing: .14em;
}

@media (max-width: 520px) {
  .shortcuts { grid-template-columns: repeat(2, 1fr); }
}
</style>
</head>
<body>
<div class="newtab">
  <div class="mark">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
      <circle cx="12" cy="12" r="2.5"/>
      <ellipse cx="12" cy="12" rx="10" ry="4.5"/>
      <ellipse cx="12" cy="12" rx="10" ry="4.5" transform="rotate(60 12 12)"/>
      <ellipse cx="12" cy="12" rx="10" ry="4.5" transform="rotate(120 12 12)"/>
    </svg>
  </div>
  <div class="wordmark">absent</div>
  <div class="clock" id="clock">— <b>—</b></div>

  <form class="search-bar" id="search-form">
    <input type="text" id="search-input" placeholder="search or enter url" spellcheck="false" autofocus>
    <button class="search-btn" type="submit" aria-label="search">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <circle cx="11" cy="11" r="7"/>
        <line x1="16.5" y1="16.5" x2="21" y2="21"/>
      </svg>
    </button>
  </form>

  <div class="shortcuts" id="shortcuts"></div>

  <div class="recent">
    <div class="recent-title">recent</div>
    <ul class="recent-list" id="recent-list"></ul>
  </div>
</div>

<script>
const DEFAULT_SHORTCUTS = [
  { name: 'games',    url: '#games',    icon: 'fa-solid fa-gamepad' },
  { name: 'anime',    url: '#anime',    icon: 'fa-solid fa-tv' },
  { name: 'music',    url: '#music',    icon: 'fa-solid fa-music' },
  { name: 'browser',  url: '#browser',  icon: 'fa-solid fa-globe' },
  { name: 'youtube',  url: 'https://youtube.com', icon: 'fa-brands fa-youtube' },
  { name: 'github',   url: 'https://github.com',  icon: 'fa-brands fa-github' },
  { name: 'reddit',   url: 'https://reddit.com',  icon: 'fa-brands fa-reddit' },
  { name: 'discord',  url: 'https://discord.com', icon: 'fa-brands fa-discord' },
];

function tick() {
  const now = new Date();
  const time = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false });
  const date = now.toLocaleDateString([], { weekday: 'long', month: 'short', day: 'numeric' });
  document.getElementById('clock').innerHTML = `${date} · <b>${time}</b>`;
}
tick();
setInterval(tick, 1000);

function renderShortcuts() {
  const stored = JSON.parse(localStorage.getItem('absent.shortcuts') || 'null');
  const list = stored || DEFAULT_SHORTCUTS;
  const el = document.getElementById('shortcuts');
  el.innerHTML = list.map(s => `
    <a class="shortcut" href="${s.url}">
      <span class="shortcut-icon"><i class="${s.icon}"></i></span>
      <span class="shortcut-name">${s.name}</span>
    </a>
  `).join('');
}

function renderRecent() {
  const recent = JSON.parse(localStorage.getItem('absent.recent') || '[]').slice(0, 5);
  const el = document.getElementById('recent-list');
  if (!recent.length) {
    el.innerHTML = '<li class="recent-empty">no recent activity</li>';
    return;
  }
  el.innerHTML = recent.map(r => `
    <a class="recent-item" href="${r.url}">
      <span class="recent-dot"></span>
      <span>${r.title || r.url}</span>
    </a>
  `).join('');
}

document.getElementById('search-form').addEventListener('submit', (e) => {
  e.preventDefault();
  const q = document.getElementById('search-input').value.trim();
  if (!q) return;
  let url = q;
  if (!/^https?:\/\//i.test(url)) {
    if (url.includes('.') && !url.includes(' ')) url = 'https://' + url;
    else url = 'https://www.google.com/search?q=' + encodeURIComponent(url);
  }
  // If embedded in iframe, tell parent to navigate
  if (window.parent !== window) {
    window.parent.postMessage({ type: 'absent.navigate', url }, '*');
  } else {
    location.href = url;
  }
});

renderShortcuts();
renderRecent();
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/js/all.min.js" defer></script>
</body>
</html>
